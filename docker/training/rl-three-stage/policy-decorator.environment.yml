name: maniskill2-pidec
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.13
  - pip
  - pytorch-cuda=12.1
  - pytorch=2.1.2
  - tensorboard
  - wandb
  - opencv
  - pytest
  - moviepy=1.0.3
  - einops
  # Newer diffusers releases probe torch.xpu at import time; torch 2.1.2 does
  # not expose that attribute, so keep the reference S1 stack on a compatible
  # release instead of resolving the newest package.
  - diffusers==0.27.2
  - pip:
      - mani-skill2==0.5.3
      - gymnasium==0.29.1
      - gymnasium-robotics==1.2.4
      - stable-baselines3==2.2.1
      - gdown==6.1.0
