# W0 causal-pair overlay. Apply with the pinned FastWAM Hydra task config.
variant: with_video
seed: 42
max_steps: 20000
batch_size: 16
num_workers: 8
learning_rate: 1.0e-4
weight_decay: 1.0e-2
lr_scheduler_type: cosine
mixed_precision: bf16
max_grad_norm: 1.0
save_every: 2000
eval_every: 0
model:
  loss:
    lambda_video: 1.0
    lambda_action: 1.0
