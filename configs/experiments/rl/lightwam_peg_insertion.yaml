schema_version: 1
experiment_id: lightwam_peg_insertion_residual_sac_v1
task:
  env_id: PegInsertionSide-v2
  registration_module: envs.maniskill_fixed
  obs_mode: rgbd
  control_mode: pd_ee_delta_pose
  camera_names: [base_camera, hand_camera]
  camera_layout: horizontal
  image_size: [224, 448]
  proprio:
    dim: 32
    fields:
      - agent.qpos[0:9]
      - agent.qvel[0:9]
      - agent.base_pose[0:7]
      - extra.tcp_pose[0:7]
    privileged_fields_excluded: true
  action:
    dim: 7
    representation: pd_ee_delta_pose
  max_episode_steps: 200
lightwam:
  source: third_party/lightwam/Light-WAM
  checkpoint: null
  resolved_config: null
  dataset_stats: null
  context: null
  action_horizon: 16
  replan_steps: 4
  ddim_steps: 10
residual_sac:
  actor_input: proprio_base_action
  residual_channels: all_executed_action_channels
  residual_horizon: 4  # replan boundary; Light-WAM still predicts a 16-step base chunk
  residual_scale: 0.1
  gamma: 0.97
  tau: 0.01
  alpha: 0.2
  utd: 0.25
  batch_size: 1024
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0001
  learning_starts: 8000
  progressive_exploration_low_level_actions: 30000
  total_low_level_actions: 4000000
  num_envs: 1
evaluation:
  eval_seeds: [1, 2, 3]
  episodes_per_seed: 50
  same_reset_seed_for_base_and_treatment: true
artifacts:
  base_training_output: null
  residual_training_output: null
  evaluation_output: null
  downloads: false
